name: Sobol FPGA Place and Route (ECP5)

on:
  workflow_dispatch:

jobs:
  pnr:

    runs-on: ubuntu-latest

    steps:

      ############################################################
      # Checkout
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # Install Tools
      ############################################################

      - name: Install FPGA Tools
        run: |
          sudo apt update
          sudo apt install -y yosys nextpnr-ecp5

      ############################################################
      # Verify Installation
      ############################################################

      - name: Verify Tool Installation
        run: |
          echo "===== YOSYS ====="
          which yosys
          yosys -V

          echo ""
          echo "===== NEXTPNR ====="
          which nextpnr-ecp5
          nextpnr-ecp5 --version || true

      ############################################################
      # Create Report Directory
      ############################################################

      - name: Create Report Directory
        run: |
          mkdir -p reports/pnr

      ############################################################
      # Generate JSON
      ############################################################

      - name: Generate Compute Core JSON
        run: |
          yosys -p "
            read_verilog -I src \
              src/compute/sc_multiplier.v \
              src/compute/sign_router.v \
              src/compute/popcount.v \
              src/compute/positive_accumulator.v \
              src/compute/negative_accumulator.v \
              src/compute/final_subtractor.v \
              synthesis/synth_compute_core.v

            hierarchy -check -top synth_compute_core

            synth_ecp5 \
              -top synth_compute_core \
              -json reports/pnr/synth_compute_core.json
          "

      ############################################################
      # Verify JSON
      ############################################################

      - name: Verify Generated Files
        run: |
          echo "===== REPORT DIRECTORY ====="
          ls -lh reports/pnr

          echo ""
          echo "===== JSON SIZE ====="
          wc -c reports/pnr/synth_compute_core.json

      ############################################################
      # Check Trellis Database
      ############################################################

      - name: Check Trellis Database
        run: |
          echo "===== Searching for Trellis DB ====="

          find /usr -type d -name "trellis*" 2>/dev/null || true
          find /usr -type d -name "ecp5*" 2>/dev/null || true

      ############################################################
      # Place and Route
      ############################################################

      - name: Run nextpnr
        run: |
          set -o pipefail

          nextpnr-ecp5 \
            --25k \
            --package CABGA381 \
            --json reports/pnr/synth_compute_core.json \
            --textcfg reports/pnr/synth_compute_core.config \
            2>&1 | tee reports/pnr/nextpnr_report.txt

      ############################################################
      # Show Report
      ############################################################

      - name: Show nextpnr Report
        if: always()
        run: |
          echo ""
          echo "=================================================="
          echo "Last 100 Lines"
          echo "=================================================="

          tail -100 reports/pnr/nextpnr_report.txt || true

      ############################################################
      # Upload Everything
      ############################################################

      - name: Upload PnR Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-pnr-results
          path: reports/pnr/
