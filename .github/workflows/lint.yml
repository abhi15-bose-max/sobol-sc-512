name: Verilog Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Lint Verilog Sources
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting Verilog Lint"
          echo "========================================"

          FILES=$(find src synthesis -name "*.v" | sort)

          for file in $FILES; do
            echo
            echo "----------------------------------------"
            echo "Linting: $file"
            echo "----------------------------------------"

            verilator \
              --lint-only \
              -Wall \
              -I./src \
              "$file"

          done

          echo
          echo "========================================"
          echo "✓ All Verilog files passed lint."
          echo "========================================"
